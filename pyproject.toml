[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pickerroy"
version = "0.3.3"
description = "本地运行的视频静帧智能筛选工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10.3,<12",
  "PySide6>=6.7,<7",
  "scenedetect>=0.6.4,<0.7",
]

[project.optional-dependencies]
mac = [
  "pyobjc-framework-Vision>=10.3",
  "pyobjc-framework-Quartz>=10.3",
]
dev = ["pytest>=8,<9", "pyinstaller>=6.14,<7"]

[project.scripts]
pickerroy = "framepick.app:main"
pickerroy-analyze = "framepick.cli:main"
pickerroy-evaluate = "framepick.evaluation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: tests that invoke FFmpeg and the full analysis pipeline"]
