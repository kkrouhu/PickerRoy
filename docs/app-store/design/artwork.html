bottom:115px;display:flex;gap:12px;background:#fff;border-radius:999px;padding:16px 18px;box-shadow:0 25px 70px rgba(0,0,0,.22)}.floating-control b{font-size:29px;padding:18px 28px;border-radius:999px;background:#111;color:#fff}.floating-control b:first-child{background:#d8ff58;color:#111}.preference-card{position:absolute;left:45px;right:45px;bottom:40px;background:#111;color:#fff;border-radius:40px;padding:42px 46px;box-shadow:0 35px 80px rgba(0,0,0,.3)}.preference-card h3{font-size:41px;margin:0 0 13px}.preference-card p{font-size:27px;color:#bbb;margin:0}.meter{height:16px;border-radius:99px;background:#444;margin:28px 0 18px;overflow:hidden}.meter:after{content:"";display:block;width:72%;height:100%;background:#d8ff58}.quote{position:absolute;left:20px;top:5px;font-size:48px;font-weight:900;line-height:1.15;max-width:760px}.quote em{font-style:normal;background:#d8ff58;padding:0 8px}.export-wrap{position:absolute;inset:30px 0 120px;display:grid;grid-template-columns:1fr 1fr;gap:22px}.export-card{position:relative;border-radius:40px;overflow:hidden;background:#ddd;box-shadow:0 24px 70px rgba(0,0,0,.15)}.export-card .photo{position:absolute;inset:0;background-size:305% 100%}.export-card:nth-child(2) .photo{filter:saturate(1.08) contrast(1.045) sharpen(1)}.export-label{position:absolute;z-index:2;left:25px;top:25px;background:#fff;border-radius:99px;padding:13px 20px;font-weight:850;font-size:23px}.export-card:nth-child(2) .export-label{background:#d8ff58}.export-note{position:absolute;bottom:42px;left:45px;right:45px;background:rgba(0,0,0,.77);color:#fff;border-radius:28px;padding:26px;font-size:25px;line-height:1.4}.privacy-stage{position:absolute;inset:10px 0 75px;border-radius:52px;background:#0b0b0b;color:#fff;overflow:hidden;padding:80px}.privacy-ring{position:absolute;width:690px;height:690px;border:2px solid #333;border-radius:50%;left:220px;top:310px}.privacy-ring:before,.privacy-ring:after{content:"";position:absolute;border:2px solid #252525;border-radius:50%;inset:80px}.privacy-ring:after{inset:170px}.device{position:absolute;z-index:2;width:330px;height:680px;border:10px solid #fff;border-radius:70px;left:400px;top:315px;background:#171717;padding:34px}.device:before{content:"";position:absolute;width:115px;height:25px;border-radius:30px;background:#fff;left:98px;top:18px}.device .logo{position:absolute;left:114px;top:260px;width:82px;height:82px}.lockline{position:absolute;left:125px;right:125px;bottom:120px;text-align:center;font-weight:850;font-size:36px}.privacy-pills{position:absolute;left:68px;right:68px;bottom:42px;display:flex;justify-content:center;gap:13px}.privacy-pills i{font-style:normal;border:1px solid #555;border-radius:99px;padding:12px 18px;font-size:19px;color:#d8ff58}.devices-stage{position:absolute;inset:30px -30px 80px}.mac{position:absolute;left:0;right:145px;top:205px;border-radius:42px;background:#111;padding:15px 15px 56px;box-shadow:0 40px 90px rgba(0,0,0,.25)}.mac img{width:100%;display:block;border-radius:24px}.mac:after{content:"";position:absolute;left:280px;right:280px;height:42px;bottom:-42px;background:#c9c9c6;border-radius:0 0 40px 40px}.phone{position:absolute;right:0;bottom:75px;width:375px;height:780px;border:12px solid #111;border-radius:70px;background:#f6f6f0;box-shadow:0 35px 80px rgba(0,0,0,.3);padding:58px 28px 32px}.phone:before{content:"";position:absolute;top:16px;left:116px;width:120px;height:28px;border-radius:99px;background:#111}.phone h4{font-size:31px;margin:12px 0 10px}.mini-status{background:#111;color:white;border-radius:16px;padding:18px;font-size:18px}.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.mini-grid div{height:175px;border-radius:17px}.phone .offline{position:absolute;bottom:28px;left:28px;right:28px;text-align:center;font-size:19px;font-weight:800}.lime{color:#7a9b00}.dark .poster{background:#0b0b0b;color:white}.dark .sub{color:#aaa}.dark .tag{border-color:#fff}.dark .footer{color:#888}.dark .footer strong,.dark .index{color:#fff}

<body><main id="app"></main>
<script>
const slides=[
{eyebrow:'01 / DISCOVER',title:'一条视频，找到最值得留住的照片',sub:'不用逐帧拖动，也不错过决定性瞬间。PickerRoy 在本机完成分析。',visual:`<div class="hero-photo"><div class="hero-caption"><b>人物 · 风景 · 细节<br>一次完成精选</b><span>8 张推荐</span></div></div>`},
{eyebrow:'02 / AESTHETICS',title:'人物与风景，都有自己的审美标准',sub:'综合人物状态、构图、清晰度、曝光与色彩，留下更有力量的画面。',visual:`<div class="triptych"><div class="tile photo person"><span class="tile-score">92</span><span class="tile-label">人物</span></div><div class="tile photo landscape"><span class="tile-score">95</span><span class="tile-label">风景</span></div><div class="tile photo fox"><span class="tile-score">91</span><span class="tile-label">细节</span></div></div>`},
{eyebrow:'03 / COMPOSE',title:'先选画幅，再找好画面',sub:'原比例、1:1、2:3、3:4、16:9、9:16，为封面与社交内容提前构图。',visual:`<div class="frames"><div class="person-full photo person"></div><div class="aspect a169"><span>16:9</span></div><div class="aspect a34"><span>3:4</span></div><div class="aspect a11"><span>1:1</span></div><div class="ratio-strip"><i>原尺寸</i><i>1:1</i><i>2:3</i><i>3:4</i><i>16:9</i><i>9:16</i></div></div>`},
{eyebrow:'04 / CONTROL',title:'长视频，也能随时暂停',sub:'暂停、继续或安全取消。已经完成的结果会保留，你可以马上处理新的素材。',visual:`<div class="screen-shell"><img class="screen" src="source/mac-results-synthetic.jpg"></div><div class="floating-control"><b>Ⅱ 暂停</b><b>继续</b><b>取消</b></div>`},
{eyebrow:'05 / PERSONAL',title:'你的选择，就是它的训练素材',sub:'喜欢与减少推荐只保存在当前设备。使用越多，推荐越接近你的视觉偏好。',visual:`<div class="quote">一千个人，<br>会得到一千种<br><em>PickerRoy</em>。</div><div class="screen-shell" style="top:360px;left:120px;right:-150px;transform:rotate(-2deg)"><img class="screen" src="source/mac-results-synthetic.jpg"></div><div class="preference-card"><h3>✦ 你的本地审美</h3><p>已学习 28 次选择 · 分析 7 条视频</p><div class="meter"></div><p>偏好始终留在设备里</p></div>`},
{eyebrow:'06 / EXPORT',title:'直接导出，或优化后导出',sub:'温和提升尺寸、色彩和锐度。不会伪造原视频中不存在的真实细节。',visual:`<div class="export-wrap"><div class="export-card"><div class="photo fox"></div><span class="export-label">直接导出</span><div class="export-note">保留原始画面<br>PNG 高质量截图</div></div><div class="export-card"><div class="photo fox"></div><span class="export-label">优化后导出</span><div class="export-note">细微提升色彩、锐度与尺寸<br>JPEG 高质量输出</div></div></div>`},
{eyebrow:'07 / PRIVATE',title:'视频不用上传，审美不必上云',sub:'无账号、无广告、无追踪。核心筛选、学习与导出完全离线。',dark:true,visual:`<div class="privacy-stage"><div class="privacy-ring"></div><div class="device"><img class="logo" src="../../../assets/PickerRoy-logo.png"></div><div class="lockline">只在你的设备上处理</div><div class="privacy-pills"><i>NO ACCOUNT</i><i>NO CLOUD</i><i>NO TRACKING</i></div></div>`},
{eyebrow:'08 / EVERYWHERE',title:'iPhone 与 Mac，同一套本地工作流',sub:'拍完就在手机选，回到电脑继续处理。一次会员发布，两端都能从 App Store 下载。',visual:`<div class="devices-stage"><div class="mac"><img src="source/mac-results-synthetic.jpg"></div><div class="phone"><h4>精选画面</h4><div class="mini-status">✓ 已导入 1 条 · 8 张候选</div><div class="mini-grid"><div class="photo person"></div><div class="photo landscape"></div><div class="photo fox"></div><div class="photo person"></div></div><div class="offline">● 全程本地离线</div></div></div>`}
];
const n=Math.max(1,Math.min(8,Number(new URLSearchParams(location.search).get('slide')||1)));const s=slides[n-1];if(s.dark)document.documentElement.classList.add('dark');document.getElementById('app').innerHTML=`<section class="poster"><header class="top"><img class="logo" src="../../../assets/PickerRoy-logo.png"><span class="brand">PickerRoy</span><span class="tag">ON-DEVICE</span></header><div class="eyebrow">${s.eyebrow}</div><h1 class="headline">${s.title}</h1><p class="sub">${s.sub}</p><div class="stage">${s.visual}</div><footer class="footer"><span><strong>PickerRoy</strong> · 从视频发现好照片</span><span class="index">0${n} / 08</span></footer></section>`;
</script>
</body></html>
